<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7a1a1a">
<title>幹部用</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#4f4f4f;--line:#d6d6d2;--accent:#7a1a1a;--accent-fg:#fff;--card:#fff;--card2:#f1f1ee;--soft:#faf3e3;--focus:#1a56db;--ok:#1b6e2f;--ok-bg:#e6f3ea;--ng:#b00020}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 84px}
header{border-bottom:3px solid var(--accent);margin-bottom:14px;padding-bottom:8px}
header h1{font-size:1.3rem;margin:0}
header .sub{color:var(--muted);font-size:.9rem}
h2{font-size:1.1rem;margin:26px 0 10px;padding:9px 14px;background:var(--accent);color:var(--accent-fg);border-radius:8px}
h3{font-size:1.02rem;margin:18px 0 6px;border-left:5px solid var(--accent);padding-left:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
button{font-size:1.05rem;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);padding:8px 12px;font-size:.95rem}
.pnav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pnav a{flex:1 1 0;text-align:center;padding:10px 6px;white-space:nowrap;font-size:.95rem;border:2px solid var(--accent);border-radius:999px;text-decoration:none;font-weight:700;color:var(--accent);background:var(--card)}
.pnav a[aria-current=page]{background:var(--accent);color:var(--accent-fg)}
@media (max-width:420px){.pnav a{flex-basis:calc(50% - 4px)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.98rem;background:var(--card)}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{background:#ececE8;font-weight:700;white-space:nowrap}
td:first-child{white-space:nowrap;width:5.5em}
tr:nth-child(even) td{background:var(--card2)}
tr.now td{background:var(--soft)!important;color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.small{color:var(--muted);font-size:.9rem}
.hint{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.95rem}
.big{font-size:1.25rem;font-weight:700;margin:2px 0 8px}
.att{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:6px 6px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .who{display:flex;align-items:center;gap:14px;flex:1 1 10em;min-height:46px;font-size:1.12rem;cursor:pointer}
.att .who input{width:28px;height:28px;flex:none;accent-color:var(--ok)}
.att.here{background:var(--ok-bg)}
.att.here .who{color:var(--ok);font-weight:700}
/* 生年月日（同点のときだけ）。狭い画面では名前の下に回る */
.bd{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:.95rem}
.bd input{font-size:1rem;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);max-width:11.5em}
.bd .ghost{padding:7px 10px}
.bd .ghost:disabled{opacity:.5;cursor:default}
.bd .done{color:var(--ok);font-weight:700}
.msg{min-height:1.5em;margin-top:8px;font-weight:700}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{position:fixed;right:12px;bottom:12px;background:var(--accent);color:var(--accent-fg);border-radius:50%;width:48px;height:48px;font-size:1.3rem;font-weight:bold;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">🀄 幹部用</h1>
    <div class="sub" id="sub">読み込み中…</div>
  </header>
  <nav class="pnav" aria-label="ページ切り替え"><a href="../" data-g>参加者ページ</a><a href="../score/" data-g>点数</a><a class="rule" href="#" hidden>ルール</a><a class="tensu" href="#" hidden>点数表</a><a href="./" data-g aria-current="page">幹部用</a></nav>

  <div id="setup" class="hint" hidden></div>

  <div id="main" hidden>
  <div id="junbibox" hidden>
  <h2>準備</h2>
  <div class="card">
    <div class="big" id="jcount"></div>
    <div id="junbi"></div>
  </div>
  <p class="small">チェックはこの端末だけに残ります。ほかの人の端末とは共有しません。</p>
  </div>

  <h2>時間割</h2>
  <div class="tw"><table id="sched"></table></div>
  <p class="small" id="schednote"></p>
  <p class="hint" id="schedmemo" hidden></p>

  <h2>出席確認</h2>
  <div class="card">
    <div class="big" id="count"></div>
    <p class="small" id="bnote" hidden></p>
    <div id="attend"></div>
    <div id="bmsg" class="msg" aria-live="polite"></div>
  </div>
  <div class="tools">
    <button class="ghost" type="button" id="reload">名前を読み直す</button>
    <button class="ghost" type="button" id="clear">チェックを全部外す</button>
  </div>
  <p class="small">チェックはこの端末だけに残ります。ほかの人の端末とは共有しません。</p>
  <h3>まだ来ていない人</h3>
  <p id="notyet"></p>
  <p class="hint">始まる前に欠席が決まったら、組み合わせを1半荘目から組み直します。組み直しを頼むときは、欠席の人の番号（例: P5）を伝えます。push してから1〜2分でページに出ます。</p>

  <h2>この回の設定</h2>
  <div class="tw"><table id="cfg"></table></div>
  </div>
  <nav class="pnav" aria-label="ページ切り替え"><a href="../" data-g>参加者ページ</a><a href="../score/" data-g>点数</a><a class="rule" href="#" hidden>ルール</a><a class="tensu" href="#" hidden>点数表</a><a href="./" data-g aria-current="page">幹部用</a></nav>
</div>

<script>
// 普段の回の幹部用ページ。会ごとの taikai.json（大会設定）から準備（junbi）・時間割（schedule）と設定を出し、受け口からは名前（名簿）と年上からの順（agerank）を読む。
// 出席のチェックはこの端末の中（localStorage）にだけ置く＝ほかの幹部の端末とは共有しない。
// 送るのは生年月日だけ（taikai.json の nenrei が true の会。予選の合計が同点のときだけ、その人たちの分を入れる）
const $ = id => document.getElementById(id);
const KAI_RE = /^[0-9A-Za-z-]{1,24}$/;
const T_RE = /^([01]?\d|2[0-3]):[0-5]\d$/;
// 会（g）。URL の ?g=（付けなければ halu）。設定は kai/g/<会>/ に置く
const G = new URLSearchParams(location.search).get('g') || 'halu';
const G_OK = /^[a-z0-9-]{1,20}$/.test(G);
const CONF = '../g/' + G + '/';
document.querySelectorAll('.pnav a[data-g]').forEach(a => { if (G !== 'halu') a.setAttribute('href', a.getAttribute('href') + '?g=' + encodeURIComponent(G)); });
let CFG = null, ROSTER = {}, HERE = new Set(), API = '';
// 年上からの順（受け口の agerank。生年月日を入れた人どうし。1 が最年長）。BIRTH_OK は受け口が生年月日を受け付けるか（古い受け口は agerank を返さない）
let AGERANK = {}, BIRTH_OK = false;
const BDRAFT = {};   // 打ちかけの生年月日（表を作り直しても消さない）
const fmt = n => Number(n).toLocaleString('ja-JP');
const dnf = p => p + (ROSTER[p] ? ' ' + ROSTER[p] : '');
const mins = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function applyTheme(c) {
  if (!/^#[0-9a-fA-F]{6}$/.test(c.color || '')) return;
  document.documentElement.style.setProperty('--accent', c.color);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', c.color);
}
function setup(msg) { $('setup').textContent = msg; $('setup').hidden = !msg; }

// ---- 時間割（taikai.json の schedule＝[["10:45","集合・受付"], …]）。開催日の当日は、いまの行に色をつける ----
function renderSched() {
  const t = $('sched'); t.innerHTML = '';
  const s = Array.isArray(CFG.schedule) ? CFG.schedule.filter(r => Array.isArray(r) && T_RE.test(String(r[0])) && typeof r[1] === 'string') : [];
  if (!s.length) { $('schednote').textContent = '時間割は、まだ大会設定にありません。'; return; }
  const isToday = CFG.date === today();
  let cur = -1;
  if (isToday) { const d = new Date(), now = d.getHours() * 60 + d.getMinutes(); s.forEach((r, i) => { if (mins(r[0]) <= now) cur = i; }); }
  t.innerHTML = '<thead><tr><th>時刻</th><th>内容</th></tr></thead>';
  const tb = document.createElement('tbody');
  s.forEach((r, i) => {
    const tr = document.createElement('tr'); if (i === cur) tr.className = 'now';
    [r[0], r[1] + (i === cur ? '（いま）' : '')].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  $('schednote').textContent = isToday ? '色のついた行が、いまの時間です。時刻は目安です。' : '時刻は目安です。';
  const memo = typeof CFG.schedule_note === 'string' ? CFG.schedule_note.trim() : '';
  $('schedmemo').hidden = !memo; $('schedmemo').textContent = memo;
}

// ---- 準備（taikai.json の junbi＝["タイマーの準備", …]。書いた会だけ出す）。チェックは出席確認と同じく、端末の中に回ごとに置く ----
const jkey = () => 'halukai:junbi:' + CFG.kai;
const junbiItems = () => Array.isArray(CFG.junbi) ? CFG.junbi.filter(s => typeof s === 'string' && s.trim()).map(s => s.trim()) : [];
function renderJunbi() {
  const items = junbiItems(), box = $('junbi');
  $('junbibox').hidden = !items.length; box.innerHTML = '';
  if (!items.length) return;
  let done = new Set();
  try { const a = JSON.parse(localStorage.getItem(jkey()) || '[]'); if (Array.isArray(a)) done = new Set(a.filter(s => items.includes(s))); } catch (e) {}
  const count = () => { $('jcount').textContent = '済み ' + done.size + ' / ' + items.length; };
  items.forEach(s => {
    const row = document.createElement('div'); row.className = 'att' + (done.has(s) ? ' here' : '');
    const lab = document.createElement('label'); lab.className = 'who';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = done.has(s);
    cb.addEventListener('change', () => {
      if (cb.checked) done.add(s); else done.delete(s);
      row.classList.toggle('here', cb.checked);
      try { localStorage.setItem(jkey(), JSON.stringify([...done])); } catch (e) {}
      count();
    });
    const sp = document.createElement('span'); sp.textContent = s;
    lab.append(cb, sp); row.appendChild(lab); box.appendChild(row);
  });
  count();
}

// ---- 出席確認（P1〜P人数。チェックは端末の中に回ごとに置く） ----
const key = () => 'halukai:attend:' + CFG.kai;
function loadHere() {
  try { const a = JSON.parse(localStorage.getItem(key()) || '[]'); HERE = new Set(Array.isArray(a) ? a.filter(p => /^P\d{1,2}$/.test(p)) : []); }
  catch (e) { HERE = new Set(); }
}
function saveHere() { try { localStorage.setItem(key(), JSON.stringify([...HERE])); } catch (e) {} }
const people = () => Array.from({ length: CFG.players }, (_, i) => 'P' + (i + 1));
function summary() {
  const ps = people(), rest = ps.filter(p => !HERE.has(p));
  $('count').textContent = '来た人 ' + (ps.length - rest.length) + ' / ' + ps.length + '人';
  $('notyet').textContent = rest.length ? rest.map(dnf).join('・') : '全員そろいました。';
}
function renderAttend() {
  const box = $('attend'); box.innerHTML = '';
  const bn = $('bnote');
  bn.hidden = !nenrei();
  bn.textContent = !API ? '受け口が未設定のため、生年月日は入れられません。'
    : !BIRTH_OK ? '受け口が古いか、つながらないため、生年月日は入れられません（受け口を新しいバージョンでデプロイすると使えます。つながらないときは「名前を読み直す」）。'
    : '生年月日は、予選の合計が同点のときだけ、その人たちの分を入れます（年齢が上の人が上位）。どのページにも出ず、入れた後は「入力済み」とだけ出ます。幹部の端末で共有されます。';
  people().forEach(p => {
    const row = document.createElement('div'); row.className = 'att' + (HERE.has(p) ? ' here' : '');
    const lab = document.createElement('label'); lab.className = 'who';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = HERE.has(p);
    cb.addEventListener('change', () => { if (cb.checked) HERE.add(p); else HERE.delete(p); row.classList.toggle('here', cb.checked); saveHere(); summary(); });
    const sp = document.createElement('span'); sp.textContent = dnf(p);
    lab.appendChild(cb); lab.appendChild(sp); row.appendChild(lab);
    if (nenrei() && API && BIRTH_OK) row.appendChild(birthCell(p));
    box.appendChild(row);
  });
  summary();
}

// ---- 生年月日（taikai.json の nenrei が true の会だけ）。予選の合計が同点なら、年齢が上の方が上位 ----
// 受け口は生年月日を返さず、入れた人どうしの年上からの順（agerank）だけを返す。そのため、ここには「入力済み」だけを出す（第20回と同じ）
const nenrei = () => !!(CFG && CFG.nenrei === true);
function birthCell(p) {
  const bd = document.createElement('div'); bd.className = 'bd';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'ghost';
  if (AGERANK[p] !== undefined) {
    const s = document.createElement('span'); s.className = 'done'; s.textContent = '生年月日 入力済み';
    b.textContent = '消す';
    b.addEventListener('click', () => sendBirth(p, '', b));
    bd.append(s, b);
  } else {
    const i = document.createElement('input'); i.type = 'date'; i.min = '1900-01-01'; i.max = today();
    i.setAttribute('aria-label', dnf(p) + ' の生年月日'); i.value = BDRAFT[p] || '';
    i.addEventListener('input', () => { BDRAFT[p] = i.value; });
    b.textContent = '入れる';
    b.addEventListener('click', () => sendBirth(p, i.value, b));
    bd.append(i, b);
  }
  return bd;
}
function sayB(t, ok) { const m = $('bmsg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'ng'); }
async function sendBirth(p, date, btn) {
  if (date === '' && AGERANK[p] === undefined) { sayB(dnf(p) + ' の生年月日を選んでから「入れる」を押してください', false); return; }
  if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) { sayB(dnf(p) + ' の生年月日の形が正しくありません', false); return; }
  if (!confirm(date ? dnf(p) + ' の生年月日を ' + date + ' で入れますか？\n（どのページにも出ません。同点の順位にだけ使います）' : dnf(p) + ' の生年月日を消しますか？')) return;
  btn.disabled = true;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'birth', kai: CFG.kai, player: p, date }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'ng');
    AGERANK = (j.data && j.data.agerank) || {};
    delete BDRAFT[p];
    renderAttend();
    sayB(dnf(p) + (date ? ' の生年月日を入れました。' : ' の生年月日を消しました。') + '点数ページの順位は、開き直すか2分ほどで変わります。', true);
  } catch (e) {
    sayB(e.message === 'date' ? '生年月日が正しくありません（1900年〜今日まで）'
      : e.message === 'closed' ? 'この回は、生年月日の受け付けを締め切りました'
      : e.message === 'action' ? '受け口が古いため、生年月日を受け付けません。受け口を新しいバージョンでデプロイしてください'
      : '送れませんでした。通信を確かめて、もう一度押してください', false);
  } finally { btn.disabled = false; }
}

// ---- この回の設定 ----
function renderCfg() {
  const c = CFG, n = c.final && c.final.tables > 0 ? c.final.tables * c.mode : 0;
  const rows = [
    ['開催日', c.date || '―'],
    ['会場', typeof c.place === 'string' && c.place ? c.place + (typeof c.address === 'string' && c.address ? '（' + c.address + '）' : '') : '―'],
    ['種類', c.mode + '麻'],
    ['人数', c.players + '人'],
    ['予選', c.prelim + '半荘'],
    ['決勝', n ? '予選の上位' + n + '人・' + c.final.hanchan + '半荘' : 'なし'],
    ...(n ? [['順位決定戦', c.final.junni === 1 ? '決勝に出ない人が、決勝1半荘目の時間に1半荘' : 'なし']] : []),
    ['予選の同点', nenrei() ? '年齢が上の人が上位（生年月日を入れる）' : '同じ順位（集計係が決める）'],
    ['持ち点', Number.isInteger(c.start) && Number.isInteger(c.return) ? fmt(c.start) + '点持ち・' + fmt(c.return) + '点返し' : '―'],
    ['回の名前', c.kai],
  ];
  const t = $('cfg'); t.innerHTML = '';
  const tb = document.createElement('tbody');
  rows.forEach(r => { const tr = document.createElement('tr'); r.forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); }); tb.appendChild(tr); });
  t.appendChild(tb);
}

const bust = u => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();
async function getJson(u) { const r = await fetch(bust(u), { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
async function load() {
  if (!G_OK) { setup('会の名前（URL の ?g=）の形が違います。'); return; }
  let c;
  try { c = await getJson(CONF + 'taikai.json'); }
  catch (e) { if (!CFG) setup('この会（' + G + '）の大会設定（taikai.json）を読めませんでした。少し待ってから開き直してください。'); return; }
  if (!c || !KAI_RE.test(String(c.kai || '')) || !Number.isInteger(c.players) || c.players < 3 || c.players > 99) { setup('大会設定（taikai.json）の書き方が違います。'); $('main').hidden = true; return; }
  CFG = c;
  applyTheme(c);
  document.title = (c.title || '') + ' 幹部用';
  $('ttl').textContent = '🀄 ' + (c.title || '') + ' 幹部用';
  $('sub').textContent = [c.date, c.mode + '麻', c.players + '人'].filter(Boolean).join('・');
  // ルール・点数表のページ（taikai.json の rule・tensu。会のフォルダの中の .html）がある会だけ、切り替えボタンに出す
  ['rule', 'tensu'].forEach(k => {
    const u = /^[a-z0-9-]{1,30}\.html$/.test(c[k] || '') ? CONF + c[k] : '';
    document.querySelectorAll('.pnav a.' + k).forEach(a => { a.hidden = !u; if (u) a.setAttribute('href', u); });
  });
  const notes = [];
  API = String(c.api || '').trim();
  BIRTH_OK = false;
  if (API) {
    try {
      const j = await getJson(API + '?kai=' + encodeURIComponent(c.kai));
      if (j.ok && j.data && j.data.kai === c.kai) {
        ROSTER = j.data.roster || {};
        BIRTH_OK = !!j.data.agerank && typeof j.data.agerank === 'object';
        AGERANK = BIRTH_OK ? j.data.agerank : {};
      }
    }
    catch (e) { notes.push('名前を読めませんでした（通信）。番号で出しています。'); }
  }
  setup(notes.join(' '));
  loadHere();
  $('main').hidden = false;
  renderJunbi(); renderSched(); renderAttend(); renderCfg();
}
$('reload').addEventListener('click', load);
$('clear').addEventListener('click', () => {
  if (!CFG || !confirm('出席のチェックを全部外しますか？')) return;
  HERE.clear(); saveHere(); renderAttend();
});
load();
// 当日は、いまの行の色を1分ごとに動かす
setInterval(() => { if (CFG) renderSched(); }, 60000);
</script>
<a class="top" href="#" title="上へ">↑</a>
</body>
</html>
