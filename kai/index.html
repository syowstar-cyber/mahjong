<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7a1a1a">
<title>トップページ</title>
<script>
// 会ごとのホーム画面のアプリ（manifest とアイコン）。会は URL の ?g=（付けなければ halu）。読み込みの途中で書き出す＝ブラウザが最初から見つけられる
(function () {
  var g = new URLSearchParams(location.search).get('g') || 'halu';
  if (!/^[a-z0-9-]{1,20}$/.test(g)) return;
  var b = 'g/' + g + '/';
  document.write('<link rel="manifest" href="' + b + 'manifest.json"><link rel="apple-touch-icon" href="' + b + 'icon-180.png"><link rel="icon" type="image/png" href="' + b + 'icon-192.png">');
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#4f4f4f;--line:#d6d6d2;--field:#8c8c86;--accent:#7a1a1a;--accent-fg:#fff;--card:#fff;--card2:#f1f1ee;--soft:#faf3e3;--focus:#1a56db;--ok:#1b6e2f;--ng:#b00020}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 84px}
header{border-bottom:3px solid var(--accent);margin-bottom:14px;padding-bottom:8px}
header h1{font-size:1.3rem;margin:0}
header .sub{color:var(--muted);font-size:.9rem}
h2{font-size:1.1rem;margin:26px 0 10px;padding:9px 14px;background:var(--accent);color:var(--accent-fg);border-radius:8px}
h3{font-size:1.02rem;margin:18px 0 6px;border-left:5px solid var(--accent);padding-left:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
label{display:block;font-weight:700;margin:0 0 4px}
select{width:100%;font-size:1.15rem;padding:12px;border:2px solid var(--field);border-radius:8px;background:#fff;color:var(--fg)}
button{font-size:1.05rem;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);padding:8px 12px;font-size:.95rem}
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.pnav a{flex:1 1 auto;text-align:center;padding:10px 4px;white-space:nowrap;font-size:.9rem;border:2px solid var(--accent);border-radius:999px;text-decoration:none;font-weight:700;color:var(--accent);background:var(--card)}
.pnav a[aria-current=page]{background:var(--accent);color:var(--accent-fg)}
/* 読み込みが終わるまで（本文が隠れている間）は、下の切り替えボタンを出さない（上の並びと隣り合って2重に見えるため） */
#main[hidden]~.pnav{display:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--card);table-layout:fixed}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
th{background:#ececE8;font-weight:700}
th:first-child,td:first-child{width:3.6em}
tr:nth-child(even) td{background:var(--card2)}
td.me{background:var(--soft) !important;color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
#mine th:first-child,#mine td:first-child{width:5.6em}
#mine th:nth-child(2),#mine td:nth-child(2),#mine th:nth-child(3),#mine td:nth-child(3){width:3.4em}
#mine.noseat th:nth-child(3),#mine.noseat td:nth-child(3){width:auto}
#sched th:first-child,#sched td:first-child{width:4.2em;white-space:nowrap}
tr.now td{background:var(--soft) !important;color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
/* 一番上の「次は」（名前を選んでいて、受け口が読めたときだけ）。自分の席の表では、点数が入った半荘を薄く、次の半荘に色をつける */
.next{background:var(--soft);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;margin:10px 0}
.next .lab{font-size:.95rem;font-weight:700;color:var(--muted)}
.next .big{font-size:1.45rem;font-weight:700;color:var(--accent);line-height:1.45}
#mine tr.past td{color:var(--muted)}
/* 決勝ライン（自分の名前の目安）。段落の間を詰める */
#line p{margin:8px 0}#line>p:first-child{margin-top:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.small{color:var(--muted);font-size:.9rem}
.hint{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.95rem}
.warn{color:var(--ng);font-weight:700}
.done{color:var(--ok);font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.info{display:flex;gap:12px;align-items:baseline}
.info[hidden]{display:none}
.info:not([hidden])+.info{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.info .k{flex:0 0 auto;font-weight:700;color:var(--accent)}
.info .v{flex:1;min-width:0}
/* 打ち上げ（第20回の参加者ページ7章と同じ形） */
.party .opt{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-weight:400;cursor:pointer}
.party .opt input{width:24px;height:24px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.party .send{width:100%;margin-top:10px;padding:12px;background:var(--accent);color:var(--accent-fg)}
.party .ghost{width:100%;margin-top:6px;font-weight:400}
.party button:disabled,.party .opt input:disabled{opacity:.5;cursor:default}
.party .st{font-size:.95rem;margin-top:8px;color:var(--muted)}
.party .st.ok{color:var(--ok);font-weight:700}
.party .st.ng{color:var(--ng);font-weight:700}
/* たたむ箱（点数入力ページと同じ形）。打ち上げは答えた後、全部の卓は名前を選んだ後にたたむ */
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
summary{cursor:pointer;font-weight:700}
details[open]>summary{margin-bottom:8px}
#usum.ok{color:var(--ok)}#usum.ng{color:var(--ng)}
.top{position:fixed;right:12px;bottom:12px;background:var(--accent);color:var(--accent-fg);border-radius:50%;width:48px;height:48px;font-size:1.3rem;font-weight:bold;display:none;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}.top.on{display:flex}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">🀄 トップページ</h1>
    <div class="sub" id="sub">読み込み中…</div>
  </header>
  <nav class="pnav" aria-label="ページ切り替え"><a href="./" aria-current="page">トップ</a><a href="score/">点数入力</a><a class="rule" href="#" hidden>ルール</a><a class="tensu" href="#" hidden>早見表</a><a class="kuji" href="kuji/" hidden>対戦表</a></nav>

  <div id="setup" class="hint" hidden></div>

  <div id="main" hidden>
  <div id="remade" class="hint warn" hidden></div>
  <div class="next" id="next" hidden></div>
  <div class="card" id="info" hidden>
    <div class="info" id="whenrow"><span class="k">日時</span><span class="v" id="when"></span></div>
    <div class="info" id="whererow"><span class="k">場所</span><span class="v" id="where"></span></div>
  </div>
  <h2 id="mineh">自分の席</h2>
  <div class="card">
    <label for="me">自分の名前</label>
    <select id="me"></select>
    <div id="mine" style="margin-top:10px"></div>
    <div class="tools">
      <button class="ghost" type="button" id="reload">最新に更新</button>
      <span class="small" id="updated"></span>
    </div>
  </div>
  <ul class="small" style="padding-left:1.3em;margin:8px 0 12px">
    <li id="seatnote">東が起家です。</li>
    <li id="finnote" hidden></li>
  </ul>

  <div id="linebox" hidden>
  <h2 id="lineh">決勝ライン</h2>
  <div class="card"><div id="line"></div></div>
  </div>

  <div id="schedbox" hidden>
  <h2>当日の流れ</h2>
  <div class="tw" id="schedtw"><table id="sched"></table></div>
  <p class="small" id="schednote" style="margin:6px 0 0"></p>
  <p class="hint" id="schedmemo" style="margin:8px 0 0" hidden></p>
  </div>

  <div id="uchibox" hidden>
  <h2>打ち上げ</h2>
  <details class="card party" id="ufold">
    <summary id="usum"></summary>
    <label for="ume">自分の名前</label>
    <select id="ume"></select>
    <p class="small" style="margin:4px 0 8px">上の「自分の名前」と同じです。どちらで選んでも、同じ名前になります。</p>
    <label class="opt"><input type="radio" name="uch" value="yes"><span>参加する</span></label>
    <label class="opt"><input type="radio" name="uch" value="no"><span>参加しない</span></label>
    <button type="button" class="send" id="usend">この内容で回答する</button>
    <button type="button" class="ghost" id="udel">回答を消す</button>
    <div class="st" id="ust" aria-live="polite"></div>
  </details>
  </div>

  <h2>半荘ごとの組み合わせ</h2>
  <p class="hint" id="kujibox" hidden></p>
  <p id="rnone" hidden></p>
  <details id="rfold" hidden>
    <summary id="rsum"></summary>
    <div id="rounds"></div>
  </details>
  </div>
  <nav class="pnav" aria-label="ページ切り替え"><a href="./" aria-current="page">トップ</a><a href="score/">点数入力</a><a class="rule" href="#" hidden>ルール</a><a class="tensu" href="#" hidden>早見表</a><a class="kuji" href="kuji/" hidden>対戦表</a></nav>
</div>

<script>
// 普段の回のトップページ（参加者向け。日時と場所・自分の卓・決勝ライン・当日の流れ・打ち上げ・組み合わせ）。会ごとの taikai.json（大会設定）と kumiawase.json（組み合わせ。kai/tools/kumiawase.py と kuji.py が書く）を読んで出す。
// 受け口からは名前（名簿）・入力済みの卓と点数・打ち上げの回答を読む。送るのは打ち上げの回答だけ。当日に組み直して push したら、開き直すか「最新に更新」で出る（開催日は2分ごとに読み直す）
const $ = id => document.getElementById(id);
const WINDS = ['東', '南', '西', '北'];
const KAI_RE = /^[0-9A-Za-z-]{1,24}$/;
// 会（g）。URL の ?g=（英小文字・数字・-）で選ぶ。付けなければ halu（Halu杯）。設定と組み合わせは kai/g/<会>/ に置く
const G = new URLSearchParams(location.search).get('g') || 'halu';
const G_OK = /^[a-z0-9-]{1,20}$/.test(G);
// 設定の置き場（kai/ から見た場所）。試験の写しだけが window.KAI_CONF_DIR で差し替える
const CONF = window.KAI_CONF_DIR !== undefined ? window.KAI_CONF_DIR : 'g/' + G + '/';
// ページ間のリンクにも会を付ける（halu は付けない）。ルール・点数早見表は会のフォルダの中なので付けない
document.querySelectorAll('.pnav a:not(.rule):not(.tensu)').forEach(a => { if (G !== 'halu') a.setAttribute('href', a.getAttribute('href') + '?g=' + encodeURIComponent(G)); });
// 「↑」は、下へ行ったときだけ出す（一番上では本文に重ねない）
addEventListener('scroll', () => { const b = document.querySelector('.top'); if (b) b.classList.toggle('on', scrollY > innerHeight / 2); }, { passive: true });
// 会の色とホーム画面の名前（taikai.json の color・short）。色はページの --accent とブラウザの帯の色に使う
function applyTheme(c) {
  if (/^#[0-9a-fA-F]{6}$/.test(c.color || '')) {
    document.documentElement.style.setProperty('--accent', c.color);
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', c.color);
  }
  let t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (!t) { t = document.createElement('meta'); t.name = 'apple-mobile-web-app-title'; document.head.appendChild(t); }
  t.content = c.short || c.group || c.title || '';
}
// ルール・点数早見表のページ（taikai.json の rule・tensu。会のフォルダの中の .html）がある会だけ、切り替えボタンに出す。くじは、くじで決める会（kuji）だけ
function pageLinks(c) {
  ['rule', 'tensu'].forEach(k => {
    const u = /^[a-z0-9-]{1,30}\.html$/.test(c[k] || '') ? CONF + c[k] : '';
    document.querySelectorAll('.pnav a.' + k).forEach(a => { a.hidden = !u; if (u) a.setAttribute('href', u); });
  });
  document.querySelectorAll('.pnav a.kuji').forEach(a => { a.hidden = !/^\d{4}-\d{2}-\d{2}$/.test(c.kuji || ''); });
}
// 前に読んだ大会設定のうち、名前・色・切り替えボタンの分（この端末に覚える。キーは会ごとで、ほかのページとルール・点数早見表も同じキー）。
// 開いた瞬間に出して、大会設定を読んだら新しくする。組み合わせと点数は覚えない（いつも新しく読む）
const SHELL_KEY = 'halukai:shell:' + G, SHELL_F = ['title', 'color', 'short', 'group', 'rule', 'tensu', 'kuji'];
function saveShell(c) { try { localStorage.setItem(SHELL_KEY, JSON.stringify(Object.fromEntries(SHELL_F.map(k => [k, c[k]])))); } catch (e) {} }
function readShell() {
  try {
    const s = JSON.parse(localStorage.getItem(SHELL_KEY));
    const o = s && typeof s === 'object' ? Object.fromEntries(SHELL_F.filter(k => typeof s[k] === 'string').map(k => [k, s[k]])) : {};
    return o.title ? o : null;
  } catch (e) { return null; }
}
function setTitle(t) { document.title = t + ' トップページ'; $('ttl').textContent = '🀄 ' + t + ' トップページ'; }
let CFG = null, KUMI = null, ROSTER = {}, DATA = null, LAST_LOAD = 0;
// 決勝ラインの計算に使う（load() で大会設定から入れる。点数入力ページと同じ名前）。DATA_ST＝受け口を読めたか（wait＝はじめの読み込み中・ok・ng）
let MODE = 4, TOTAL = 100000, OKA = 0, PRELIM = [], FINALS = [], LOCKED = [], AGERANK = {}, DATA_ST = 'wait';
const nm = p => (p && ROSTER[p]) || '';
const dn = p => nm(p) || p || '';
const dnf = p => p ? p + (nm(p) ? ' ' + nm(p) : '') : '';
const pnum = p => Number(String(p).slice(1));
// 覚えた名前（端末の中）。今回の名簿にない番号なら、選んでいないのと同じに扱う（覚えたものは消さない）
let SAVED = '', ME = '';
try { SAVED = localStorage.getItem('halukai:me:' + G) || ''; } catch (e) {}

function checkCfg(c) {
  const e = [];
  if (!c || typeof c !== 'object') return ['中身が読めません'];
  if (!KAI_RE.test(String(c.kai || ''))) e.push('kai');
  if (c.mode !== 3 && c.mode !== 4) e.push('mode');
  if (!Number.isInteger(c.players) || c.players < 3 || c.players > 99) e.push('players');
  if (!Number.isInteger(c.prelim) || c.prelim < 1 || c.prelim > 20) e.push('prelim');
  if (!c.final || !Number.isInteger(c.final.tables)) e.push('final');
  return e;
}
const rounds = () => (KUMI && KUMI.rounds) ? Object.keys(KUMI.rounds).filter(k => /^\d+$/.test(k)).sort((a, b) => a - b) : [];
function players() {
  const s = new Set(Array.from({ length: CFG.players }, (_, i) => 'P' + (i + 1)));
  rounds().forEach(k => { const r = KUMI.rounds[k]; (r.tables || []).forEach(t => (t.p || []).forEach(p => s.add(p))); (r.rest || []).forEach(p => s.add(p)); (r.out || []).forEach(p => s.add(p)); });
  return [...s].sort((a, b) => pnum(a) - pnum(b));
}
const doneOf = (k, no) => !!(DATA && DATA.rounds && DATA.rounds[k] && DATA.rounds[k][String(no)]);
// 場決めあり（taikai.json の bakime）。席は半荘ごとに牌を引いて決めるので、組み合わせ表の並びは席でない（風を出さない）
const bakime = () => !!(CFG && CFG.bakime === true);
// 当日の流れ（taikai.json の schedule＝[["10:45","集合・受付"], …]。幹部用の時間割と同じ）。開催日の当日は、いまの行に色をつける
const T_RE = /^([01]?\d|2[0-3]):[0-5]\d$/;
const mins = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const str = v => typeof v === 'string' ? v.trim() : '';
const schedRows = () => Array.isArray(CFG.schedule) ? CFG.schedule.filter(r => Array.isArray(r) && T_RE.test(String(r[0])) && typeof r[1] === 'string') : [];
function renderSched() {
  const s = schedRows(), memo = str(CFG.schedule_note);
  $('schedbox').hidden = !s.length;
  $('schedmemo').hidden = !(s.length && memo); $('schedmemo').textContent = memo;
  if (!s.length) { $('schednote').textContent = ''; return; }
  const isToday = CFG.date === today();
  let cur = -1;
  if (isToday) { const d = new Date(), now = d.getHours() * 60 + d.getMinutes(); s.forEach((r, i) => { if (mins(r[0]) <= now) cur = i; }); }
  const t = $('sched');
  t.innerHTML = '<thead><tr><th>時刻</th><th>内容</th></tr></thead>';
  const tb = document.createElement('tbody');
  s.forEach((r, i) => {
    const tr = document.createElement('tr'); if (i === cur) tr.className = 'now';
    [r[0], r[1] + (i === cur ? '（いま）' : '')].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  $('schednote').textContent = isToday ? '色のついた行が、いまの時間です。時刻は目安です。' : '時刻は目安です。';
}
// ページの一番上の日時と場所。日時は開催日（taikai.json の date）と、当日の流れの最初と「終了」の行の時刻。
// 場所は taikai.json の place・address。地図はグーグルマップで住所を探す（郵便番号は外す）
const WDAY = ['日', '月', '火', '水', '木', '金', '土'];
function dayText(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return '';
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日（' + WDAY[d.getDay()] + '）';
}
function renderInfo() {
  const day = dayText(CFG.date), place = str(CFG.place), s = schedRows();
  // 「10:45 集合 〜 18:30 終了（目安）」。内容は「・」の前だけ（集合・受付・写真撮影 → 集合）。
  // 終わりは「終了」で始まる行（その後の打ち上げは入れない）。なければ最後の行
  const at = r => r[0] + ' ' + r[1].split('・')[0];
  const end = s.find(r => r[1].startsWith('終了')) || s[s.length - 1];
  const when = $('when'); when.innerHTML = '';
  if (day) {
    when.appendChild(document.createTextNode(day));
    if (s.length > 1) { when.appendChild(document.createElement('br')); when.appendChild(document.createTextNode(at(s[0]) + ' 〜 ' + at(end))); }
  }
  $('whenrow').hidden = !day;
  $('whererow').hidden = !place;
  renderPlace(place, str(CFG.address));
  $('info').hidden = !day && !place;
}
function renderPlace(place, addr) {
  const box = $('where'); box.innerHTML = '';
  if (!place) return;
  const b = document.createElement('b'); b.textContent = place; box.appendChild(b);
  if (addr) { box.appendChild(document.createElement('br')); box.appendChild(document.createTextNode(addr)); }
  const a = document.createElement('a');
  a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((addr.replace(/^〒?\s*\d{3}-\d{4}\s*/, '') + ' ' + place).trim());
  a.target = '_blank'; a.rel = 'noopener'; a.textContent = '地図を開く';
  box.appendChild(document.createElement('br')); box.appendChild(a);
}

function render() {
  const c = CFG;
  setTitle(c.title);
  $('sub').textContent = [c.mode + '麻', '予選' + c.prelim + '半荘', c.final.tables > 0 ? '決勝' + (c.final.tables > 1 ? c.final.tables + '卓' : '') + (c.final.hanchan > 1 ? c.final.hanchan + '半荘' : '') : ''].filter(Boolean).join('・');
  const rs = rounds();

// ---- 決勝ライン（決勝のある会。第20回の6位ラインと同じ考え方。決勝に進む人数を K として K位ライン） ----
// 自分の名前の、ラインまでの差と、次の半荘で要る点棒の目安（2026-11-03 に点数入力ページから移した。主催）。
// 計算は score/index.html の umaFor・calcTable・prelimStats・borderFor・lineTie・needRaw と同じ（どちらかを直したら、もう片方も直す）
const fmt = n => (n === null || n === undefined) ? '' : n.toLocaleString('ja-JP');
// ポイントは 0.1 単位の整数で持ち、表示で小数1桁にする（浮動小数の誤差を出さない）
const fpt = n => (n === null || n === undefined) ? '' : (n > 0 ? '+' : n < 0 ? '−' : '') + (Math.abs(n) / 10).toLocaleString('ja-JP', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isLocked = r => LOCKED.includes(String(r));
const recsOf = r => (DATA && DATA.rounds && DATA.rounds[r]) || {};
const kumiRound = r => (KUMI && KUMI.rounds && KUMI.rounds[r]) || null;
const restOf = r => { const k = kumiRound(r); return (k && Array.isArray(k.rest)) ? k.rest : []; };
// その半荘の卓がぜんぶ入ったか（卓の数は組み合わせ表。表がない間は人数割り）
const roundDone = r => { const k = kumiRound(r), n = k && Array.isArray(k.tables) && k.tables.length ? k.tables.length : Math.floor(CFG.players / MODE); return n > 0 && Object.keys(recsOf(r)).length >= n; };
// 年齢の上下（nenrei の会）。受け口の agerank＝生年月日を入れた人どうしの年上からの順（1 が最年長・同じ日は同じ数）
const nenrei = () => !!(CFG && CFG.nenrei === true);
const age = p => (nenrei() && Number.isInteger(AGERANK[p])) ? AGERANK[p] : null;
// 返し以上の人数で順位点が変わるとき（uma が表）は、その人数の行を使う。表にない人数は "1" の行
function umaFor(raws) {
  const u = CFG.uma;
  if (Array.isArray(u)) return u;
  const n = raws.filter(v => v >= CFG.return).length;
  return u[String(n)] || u['1'];
}
// 1卓の点棒 → 順位とポイント（0.1単位の整数）。全員そろっていなければ null。同点は順位点（オカ込み）を分け、割り切れない分は起家に近い方
function calcTable(raws) {
  if (!Array.isArray(raws) || raws.length !== MODE || raws.some(v => v === null || v === undefined || Number.isNaN(v))) return (raws || []).map(() => null);
  const bonus = umaFor(raws).map((x, i) => Math.round(x * 10) + (i === 0 ? OKA : 0));
  const order = raws.map((raw, i) => ({ i, raw })).sort((a, b) => b.raw - a.raw || a.i - b.i);
  const res = raws.map(() => null);
  for (let k = 0; k < MODE;) {
    let j = k; while (j + 1 < MODE && order[j + 1].raw === order[k].raw) j++;
    const n = j - k + 1, sum = bonus.slice(k, j + 1).reduce((a, b) => a + b, 0);
    const base = Math.floor(sum / n), rem = sum - base * n;
    for (let m = k; m <= j; m++) {
      const o = order[m];
      res[o.i] = { raw: o.raw, rank: k + 1, tie: n > 1, pts: (o.raw - CFG.return) / 100 + base + (m - k < rem ? 1 : 0) };
    }
    k = j + 1;
  }
  return res;
}
// 予選の順位。合計ポイントの大きい順。抜け番の半荘は0ポイント。合計が同じかたまりは、全員の生年月日が入っていれば年上から（nenrei の会）
function prelimStats() {
  const st = {};
  const add = p => st[p] || (st[p] = { p, by: {}, total: 0, n: 0 });
  players().forEach(add);
  PRELIM.forEach(r => Object.entries(recsOf(r)).forEach(([t, rec]) => {
    const res = calcTable(rec.raw);
    (rec.p || []).forEach((p, i) => { const x = add(p); if (res[i]) { x.by[r] = { pts: res[i].pts, table: t }; x.total += res[i].pts; x.n++; } });
  }));
  const list = Object.values(st).sort((a, b) => b.total - a.total || pnum(a.p) - pnum(b.p));
  for (let i = 0; i < list.length;) {
    let j = i; while (j + 1 < list.length && list[j + 1].total === list[i].total) j++;
    const g = list.slice(i, j + 1), byAge = g.length > 1 && g.every(x => age(x.p) !== null);
    if (byAge) g.sort((a, b) => age(a.p) - age(b.p) || pnum(a.p) - pnum(b.p));
    g.forEach((x, m) => { x.byAge = byAge; list[i + m] = x; });
    i = j + 1;
  }
  list.forEach((x, i) => { const y = list[i - 1]; x.rank = y && y.total === x.total && (!x.byAge || age(y.p) === age(x.p)) ? y.rank : i + 1; });
  list.forEach(x => { x.tie = x.n > 0 && list.some(y => y !== x && y.n > 0 && y.rank === x.rank); });
  list.forEach(x => { x.byAge = x.byAge && x.n > 0 && !x.tie; });
  return list;
}
const lineK = () => FINALS.length ? CFG.final.tables * MODE : 0;
// 全部の半荘が確定したら出さない（点数入力ページの集計表の列と赤い線と同じ）
const lineShow = () => lineK() > 0 && !PRELIM.concat(FINALS).every(isLocked);
// 途中で抜けた人（予選の最後の半荘の組み合わせ表で「お休み」）。決勝には進まない
const goneList = () => { const k = kumiRound(PRELIM[PRELIM.length - 1]); return (k && Array.isArray(k.out)) ? k.out : []; };

function borderFor(rk, p) {

}
// ラインと同じ合計のとき: まだ決まらない同点のかたまりが、K位と K+1位の境目をまたぐかで分ける（点数入力ページと同じ）
function lineTie(rk, x) {

  if (i < 0) return '';

  if (hi <= K - 1) return x.byAge || x.tie ? '圏内（年齢）' : '';
  return !nenrei() || ok.slice(lo, hi + 1).every(y => age(y.p) !== null) ? '同点（集計係が決める）' : '同点（年齢で決まる）';
}
// 逆算で使う点棒の上限と下限（受け口と同じ）。r 位（0 始まり）で取れる点棒の上限は、卓の合計から、上の人が自分と同じ・下の人が下限のとき
const RAW_TOP = 999900, RAW_LOW = -200000;
const rawCap = r => Math.min(RAW_TOP, Math.floor((TOTAL - (MODE - 1 - r) * RAW_LOW) / (r + 1) / 100) * 100);
// r 位の点棒の下限。1位は卓の合計の人数割り（全員同じ点）より下にならない。2位から下は受け口の下限
const rawMin = r => r === 0 ? Math.ceil(TOTAL / MODE / 100) * 100 : RAW_LOW;
// r 位の順位点（オカ込み・0.1単位）。返し以上の人数で変わる会（3麻）は、いちばん少ない場合で見る（目安を甘くしない）。
// 自分が返し以上なら、返し以上は r+1 人以上。返し未満なら r 人以下。卓の合計で上限がある。その形になれないときは null
function bonusLow(r, up) {
  const cap = Math.floor(TOTAL / CFG.return), lo = up ? r + 1 : 0, hi = up ? Math.min(MODE, cap) : Math.min(r, cap);
  let b = null;
  for (let n = lo; n <= hi; n++) {
    if (n === 0 && TOTAL >= MODE * CFG.return) continue;   // 全員が返し未満にはなれない
    const u = Array.isArray(CFG.uma) ? CFG.uma : (CFG.uma[String(n)] || CFG.uma['1']);
    const v = Math.round(u[r] * 10) + (r === 0 ? OKA : 0);
    if (b === null || v < b) b = v;
  }
  return b;
}
// 次の半荘を r 位で終えて need（0.1単位）を取るのに要る点棒（この点棒以上ならOK）。取れないときは Infinity
function needRaw(r, need) {
  const R = CFG.return, bU = bonusLow(r, true), bD = bonusLow(r, false);
  const rU = bU === null ? Infinity : Math.max(R, R + (need - bU) * 100);   // 返し以上で足りる一番小さい点棒
  const rD = bD === null ? Infinity : R + (need - bD) * 100;                // 返し未満で足りる一番小さい点棒
  // 返し未満で足りても、返しちょうどで足りないとき（3麻で2人浮きになると順位点が下がる）は、返し以上の側の値を出す
  return rD < R && (rU === R || rU === Infinity) ? rD : rU;
}
// 自分の名前（ME）の、いまの予選の順位・K位ラインまでの差・次の半荘の順位ごとに要る点棒の目安。読み直すたびに出し直す
function renderLine() {
  const box = $('linebox'), out = $('line'), K = lineK(), p = ME;
  box.hidden = !lineShow() || !String(CFG.api || '').trim();
  if (box.hidden) return;
  $('lineh').textContent = K + '位ライン（決勝に行ける目安）';
  if (!p) { out.innerHTML = '<p class="small">上の「自分の名前」を選ぶと、' + K + '位ラインまでの差と、次の半荘で要る点棒の目安が出ます。</p>'; return; }
  if (!DATA) { out.innerHTML = '<p class="small">' + (DATA_ST === 'wait' ? '点数を読み込み中…' : '点数を読めませんでした。少し待ってから「最新に更新」を押してください。') + '</p>'; return; }
  const rk = prelimStats(), x = rk.find(y => y.p === p);
  if (!x || !rk.some(y => y.n > 0)) { out.innerHTML = '<p class="small">予選の点数が入ると、' + K + '位ラインまでの差と、次の半荘で要る点棒の目安が出ます。</p>'; return; }
  let h = x.n ? '<p>' + esc(dn(p)) + ' の現在: 予選 ' + x.rank + '位' + (x.tie ? '（同点）' : x.byAge ? '（年齢）' : '') + '・合計 <b>' + fpt(x.total) + '</b>（' + x.n + '半荘）</p>' : '<p>' + esc(dn(p)) + ' はまだポイントがありません。</p>';

  const D = B - x.total, t = D === 0 && x.n ? lineTie(rk, x) : '';
  h += '<p>' + K + '位ライン（自分を除いた' + K + '番目の合計）: <b>' + fpt(B) + '</b></p>';
  if (D < 0) h += '<p>いまは<b>圏内</b>。' + (K + 1) + '位との差は ' + fpt(-D) + ' です。</p>';
  else if (t) h += '<p>' + K + '位ラインと同じ合計です。' + (t === '圏内（年齢）' ? 'いまは<b>圏内</b>です（年齢が上のため）。' : t === '同点（集計係が決める）' ? (nenrei() ? '生年月日も同じなので、' : '') + '集計係が決めます。' : '同点は年齢が上の方が上位なので、生年月日で決まります。') + '</p>';
  else h += '<p>圏内に入るには <b>あと ' + fpt(D + 1) + '</b> 必要です（同点は' + (nenrei() ? '年齢順の' : '集計係が決める') + 'ため、上回る数字）。</p>';
  // 予選の残り（まだ点数がなく、抜け番でもない半荘）
  const left = PRELIM.filter(r => !x.by[r] && !isLocked(r) && !roundDone(r) && !restOf(r).includes(p)).length;
  if (!left) { out.innerHTML = h + '<p class="small">予選の半荘は、もう残っていません。</p>'; return; }
  const need = D + 1;
  // 次の半荘で要るポイントはどの順位でも同じなので、表は順位ごとの点棒だけ
  h += '<p>次の半荘で圏内に' + (D < 0 ? '残る' : '入る') + '目安（順位ごとに、この点棒以上ならOK。予選の残りは' + left + '半荘）:</p><div class="tw"><table><thead><tr><th>順位</th><th>必要な点棒</th></tr></thead><tbody>';
  for (let r = 0; r < MODE; r++) {
    const raw = needRaw(r, need);
    const c = raw > rawCap(r) ? '届かない' : raw <= rawMin(r) ? 'どんな点数でもOK' : fmt(raw) + ' 以上';
    h += '<tr><td>' + (r + 1) + '位</td><td>' + c + '</td></tr>';
  }
  h += '</tbody></table></div><p class="small">ほかの人の結果でラインは動きます。目安として見てください。' + (Array.isArray(CFG.uma) ? '' : '順位点が浮きの人数で変わるため、少ない方の順位点で計算しています。') + '</p>';
  out.innerHTML = h;
}
// 名前を選んだら（上の欄でも打ち上げの欄でも）、この端末に覚えて出し直す。
// 打ち上げの欄で選んだときは、上の表が伸び縮みしても、その欄が画面の同じ所に残るようにする
function pickMe(v, keep) {
  SAVED = v; UCHI_PICKED = false;
  try { localStorage.setItem('halukai:me:' + G, SAVED); } catch (e) {}
  const y = keep ? keep.getBoundingClientRect().top : 0;
  render();
  // 打ち上げの欄で選んだときは、答えた人でも欄をたたまない（選んだ所が消えないように）
  if (keep) { $('ufold').open = true; window.scrollBy(0, keep.getBoundingClientRect().top - y); }
}
$('me').addEventListener('change', () => pickMe($('me').value));
$('ume').addEventListener('change', () => pickMe($('ume').value, $('ume')));

// ---- 打ち上げ（taikai.json の uchiage が true の会。第20回の参加者ページ7章を、P番号で答える形にしたもの） ----
// 答えるのは「自分の名前」で選んだ人（この欄の名前の欄は、上の「自分の名前」と同じ ME）。受け口に P番号ごとに置く。全員の出欠は、幹部用ページにだけ出す（主催）
const UCH_LABEL = { yes: '参加する', no: '参加しない' };
// 受け口の回答（{P3: {choice, ts}}）と、読めたか（ok・old＝受け口が古い・net＝通信・none＝受け口なし・wait＝はじめの読み込み中）
let UCHI = {}, UCHI_ST = 'wait';
// 選んだが、まだ送っていない（開催日の自動の読み直しで、選んだ所を回答済みの内容に戻さない）。送ったときと、名前を選び直したときに戻す
let UCHI_PICKED = false;
document.querySelectorAll('input[name=uch]').forEach(x => x.addEventListener('change', () => { UCHI_PICKED = true; }));
const uts = ts => ts ? String(ts).slice(5, 16).replace('-', '/') : '';
function sayU(t, cls) { const m = $('ust'); m.textContent = t; m.className = 'st' + (cls ? ' ' + cls : ''); }
function renderUchi() {
  $('uchibox').hidden = !(CFG.uchiage === true);
  if (CFG.uchiage !== true) return;
  const ok = UCHI_ST === 'ok', mine = ME && UCHI[ME] && UCH_LABEL[UCHI[ME].choice] ? UCHI[ME] : null;
  document.querySelectorAll('input[name=uch]').forEach(x => { if (!UCHI_PICKED) x.checked = !!(mine && mine.choice === x.value); x.disabled = !ok || !ME; });
  $('usend').disabled = !ok || !ME; $('udel').disabled = !ok || !mine;
  // いまの回答は、たたむ箱の見出しの行に出す。答えた後はたたむ（押すと開いて変えられる）。下の欄は、送信中・消した・送れなかった時だけ
  const s = $('usum');
  s.textContent = !ok ? (UCHI_ST === 'wait' ? '回答を読み込み中…' : UCHI_ST === 'net' ? '回答を読めませんでした（通信）。少し待ってから開き直してください。' : '打ち上げの回答は、まだ受け付けていません（準備中）。')
    : mine ? '回答済み: ' + UCH_LABEL[mine.choice] + '（' + uts(mine.ts) + '）' : ME ? 'まだ回答がありません' : '名前を選ぶと、答えられます';
  s.className = ok && mine ? 'ok' : UCHI_ST === 'net' ? 'ng' : '';
  sayU('');
  autoOpen('ufold', [UCHI_ST, ME, mine ? mine.choice + mine.ts : ''].join('|'), ok && !mine);
}
async function sendUchi(choice) {
  if (!ME) { sayU('名前を選んでください', 'ng'); return; }
  if (choice === undefined) { const r = document.querySelector('input[name=uch]:checked'); if (!r) { sayU('「参加する」か「参加しない」を選んでください', 'ng'); return; } choice = r.value; }
  const who = ME;
  sayU('送信中…');
  try {
    const r = await fetch(String(CFG.api || '').trim(), { method: 'POST', body: JSON.stringify({ action: 'uchiage', kai: CFG.kai, player: who, choice }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'ng');
    UCHI = (j.data && j.data.uchiage) || {}; UCHI_PICKED = false;
    renderUchi();
    if (!choice) sayU('回答を消しました');
  } catch (e) { sayU(e.message === 'action' ? '受け口が古いため、まだ答えられません（幹部に知らせてください）' : '送れませんでした。電波のよい所でもう一度お試しください', 'ng'); }
}
$('usend').addEventListener('click', () => sendUchi());
$('udel').addEventListener('click', () => { if (confirm('打ち上げの回答を消しますか？')) sendUchi(''); });

// ---- くじ（taikai.json の kuji＝抽せんの日。その日のナンバーズ4の当せん番号で、誰がどの枠に入るかを決める。kai/tools/kuji.py） ----
const kujiDay = () => /^\d{4}-\d{2}-\d{2}$/.test(CFG.kuji || '') ? CFG.kuji : '';
function renderKuji() {
  const d = kujiDay(), box = $('kujibox');
  box.hidden = !d; box.innerHTML = '';
  if (!d) return;
  const n4 = KUMI && KUMI.kuji && /^\d{4}$/.test(KUMI.kuji.n4 || '') ? KUMI.kuji.n4 : '';
  box.appendChild(document.createTextNode(n4
    ? '組み合わせは、' + dayText(d) + 'のナンバーズ4の当せん番号「' + n4 + '」で、くじで決めました。'
    : '卓と抜け番の並び（型）は決めてあります。誰がどの枠に入るかは、' + dayText(d) + 'のナンバーズ4の当せん番号で、くじで決めます。'));
  const a = document.createElement('a'); a.href = 'kuji/' + (G !== 'halu' ? '?g=' + encodeURIComponent(G) : ''); a.textContent = '対戦表のページ（くじの決まり・型・検算）';
  box.appendChild(document.createElement('br')); box.appendChild(a);
}

const bust = u => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();
async function getJson(u) { const r = await fetch(bust(u), { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
function setup(msg) { $('setup').textContent = msg; $('setup').hidden = !msg; }
// URL の # の場所へ（対戦表の「決勝ライン」から来たとき。#lineh）。本文は読み込みの後に出るので、ブラウザが自分では飛べない。
// 飛んだ後の画面の位置を返す（その場所がなければ null）
let JUMPED = false;
function jumpToHash() {
  let id = '';
  try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { id = ''; }
  const el = id ? document.getElementById(id) : null;
  if (!el || el.closest('[hidden]')) return null;
  el.scrollIntoView();
  return Math.round(scrollY);
}
async function load() {
  LAST_LOAD = Date.now();
  if (!G_OK) { setup('会の名前（URL の ?g=）の形が違います。'); return; }
  // 大会設定と組み合わせは、同時に取りに行く（順に待つと、スマホの回線で本文が出るのが遅れる）
  const cp = getJson(CONF + 'taikai.json'), kp = getJson(CONF + 'kumiawase.json').catch(() => null);
  let c;
  try { c = await cp; }
  catch (e) { if (!CFG) setup('この会（' + G + '）の大会設定（taikai.json）を読めませんでした。URL の ?g= を確かめて、少し待ってから開き直してください。'); return; }
  const errs = checkCfg(c);
  if (errs.length) { setup('大会設定（taikai.json）の書き方が違います: ' + errs.join('・')); $('main').hidden = true; return; }
  const notes = [];
  let k = await kp;
  if (k && (k.kai !== c.kai || !k.rounds || typeof k.rounds !== 'object')) { if (k.kai !== c.kai && Object.keys(k.rounds || {}).length) notes.push('組み合わせ表（kumiawase.json）が前の回のままなので出していません。'); k = null; }
  CFG = c; KUMI = k;
  MODE = c.mode; TOTAL = c.start * MODE; OKA = (c.return - c.start) * MODE / 100;
  PRELIM = Array.from({ length: c.prelim }, (_, i) => String(i + 1));
  FINALS = c.final.tables > 0 ? Array.from({ length: c.final.hanchan }, (_, i) => 'F' + (i + 1)) : [];
  LOCKED = (c.locked || []).map(String);
  applyTheme(c);
  pageLinks(c);
  saveShell(c);
  const api = String(c.api || '').trim();
  if (!api) UCHI_ST = 'none';
  // 受け口（名前・入力済みの卓・打ち上げ）を待たずに、設定と組み合わせ表で先に出す。はじめは、受け口が返るまで名前が番号のまま
  setup(notes.join(' '));
  $('main').hidden = false;
  render();
  // # の場所へは、はじめの読み込みだけ。受け口の返事で上の欄の高さが変わるので、その間に画面を動かしていなければ、返事の後にもう一度
  const jy = JUMPED ? null : jumpToHash();
  JUMPED = true;
  if (!api) return;
  try {
    const j = await getJson(api + '?kai=' + encodeURIComponent(c.kai));
    if (j.ok && j.data && j.data.kai === c.kai) {
      ROSTER = j.data.roster || {}; DATA = j.data; DATA_ST = 'ok';
      AGERANK = (j.data.agerank && typeof j.data.agerank === 'object') ? j.data.agerank : {};
      // 打ち上げの回答（古い受け口は uchiage を返さない）
      const u = j.data.uchiage;
      UCHI_ST = u && typeof u === 'object' && !Array.isArray(u) ? 'ok' : 'old'; UCHI = UCHI_ST === 'ok' ? u : {};
    } else { if (UCHI_ST === 'wait') UCHI_ST = 'none'; if (!DATA) DATA_ST = 'ng'; }
  }
  // 読み直しで通信が切れたときは、前に読めた名前と点数のまま出す
  catch (e) { if (!DATA) { notes.push('名前を読めませんでした（通信）。番号で出しています。'); DATA_ST = 'ng'; } if (UCHI_ST !== 'ok') UCHI_ST = 'net'; }
  setup(notes.join(' '));
  render();
  if (jy !== null && jy === Math.round(scrollY)) jumpToHash();
}
$('reload').addEventListener('click', load);
// 前に読んだ名前・色・切り替えボタンを、大会設定を待たずに出す（切り替えた直後に、ボタンが2つだけの画面を出さない）
const SH = G_OK ? readShell() : null;
if (SH) { applyTheme(SH); pageLinks(SH); setTitle(SH.title); }
load();
// 当日は、いまの行の色を1分ごとに動かす
setInterval(() => { if (CFG) renderSched(); }, 60000);
// 開催日は、画面に出ているときだけ2分ごとに読み直す（決勝ラインと「次は」を新しくする。受け口の読み取りは1日の回数に上限があるため、点数入力ページと同じ間隔で、ほかの日は読み直さない）
setInterval(() => { if (CFG && CFG.date === today() && !document.hidden && Date.now() - LAST_LOAD >= 120000) load(); }, 15000);
// ホーム画面のアプリ用の読み込みの手伝い（kai/sw.js）。試験の写しでは使わない
if ('serviceWorker' in navigator && window.KAI_CONF_DIR === undefined) navigator.serviceWorker.register('sw.js').catch(() => {});
// 裏から戻ったとき、2分以上たっていれば読み直す（当日の組み直しに気づけるように）
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - LAST_LOAD >= 120000) load(); });
</script>
