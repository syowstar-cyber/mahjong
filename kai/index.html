<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7a1a1a">
<title>トップページ</title>
<script>
// 会ごとのホーム画面のアプリ（manifest とアイコン）。会は URL の ?g=（付けなければ halu）。読み込みの途中で書き出す＝ブラウザが最初から見つけられる
(function () {
  var g = new URLSearchParams(location.search).get('g') || 'halu';
  if (!/^[a-z0-9-]{1,20}$/.test(g)) return;
  var b = 'g/' + g + '/';
  document.write('<link rel="manifest" href="' + b + 'manifest.json"><link rel="apple-touch-icon" href="' + b + 'icon-180.png"><link rel="icon" type="image/png" href="' + b + 'icon-192.png">');
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#4f4f4f;--line:#d6d6d2;--accent:#7a1a1a;--accent-fg:#fff;--card:#fff;--card2:#f1f1ee;--soft:#faf3e3;--focus:#1a56db;--ok:#1b6e2f;--ng:#b00020}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 84px}
header{border-bottom:3px solid var(--accent);margin-bottom:14px;padding-bottom:8px}
header h1{font-size:1.3rem;margin:0}
header .sub{color:var(--muted);font-size:.9rem}
h2{font-size:1.1rem;margin:26px 0 10px;padding:9px 14px;background:var(--accent);color:var(--accent-fg);border-radius:8px}
h3{font-size:1.02rem;margin:18px 0 6px;border-left:5px solid var(--accent);padding-left:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
label{display:block;font-weight:700;margin:0 0 4px}
select{width:100%;font-size:1.15rem;padding:12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
button{font-size:1.05rem;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);padding:8px 12px;font-size:.95rem}
.pnav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pnav a{flex:1 1 0;text-align:center;padding:10px 6px;white-space:nowrap;font-size:.95rem;border:2px solid var(--accent);border-radius:999px;text-decoration:none;font-weight:700;color:var(--accent);background:var(--card)}
.pnav a[aria-current=page]{background:var(--accent);color:var(--accent-fg)}
@media (max-width:420px){.pnav a{flex-basis:calc(50% - 4px)}}
/* 読み込みが終わるまで（本文が隠れている間）は、下の切り替えボタンを出さない（上の並びと隣り合って2重に見えるため） */
#main[hidden]~.pnav{display:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--card);table-layout:fixed}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
th{background:#ececE8;font-weight:700}
th:first-child,td:first-child{width:3.6em}
tr:nth-child(even) td{background:var(--card2)}
td.me{background:var(--soft) !important;color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
#mine th:first-child,#mine td:first-child{width:5.6em}
#mine th:nth-child(2),#mine td:nth-child(2),#mine th:nth-child(3),#mine td:nth-child(3){width:3.4em}
#mine.noseat th:nth-child(3),#mine.noseat td:nth-child(3){width:auto}
#sched th:first-child,#sched td:first-child{width:4.2em;white-space:nowrap}
tr.now td{background:var(--soft) !important;color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.small{color:var(--muted);font-size:.9rem}
.hint{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.95rem}
.warn{color:var(--ng);font-weight:700}
.done{color:var(--ok);font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.info{display:flex;gap:12px;align-items:baseline}
.info[hidden]{display:none}
.info:not([hidden])+.info{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.info .k{flex:0 0 auto;font-weight:700;color:var(--accent)}
.info .v{flex:1;min-width:0}
/* 打ち上げ（第20回の参加者ページ7章と同じ形） */
.party .opt{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-weight:400;cursor:pointer}
.party .opt input{width:24px;height:24px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.party .send{width:100%;margin-top:10px;padding:12px;background:var(--accent);color:var(--accent-fg)}
.party .ghost{width:100%;margin-top:6px;font-weight:400}
.party button:disabled,.party .opt input:disabled{opacity:.5;cursor:default}
.party .st{font-size:.95rem;margin-top:8px;color:var(--muted)}
.party .st.ok{color:var(--ok);font-weight:700}
.party .st.ng{color:var(--ng);font-weight:700}
.top{position:fixed;right:12px;bottom:12px;background:var(--accent);color:var(--accent-fg);border-radius:50%;width:48px;height:48px;font-size:1.3rem;font-weight:bold;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">🀄 トップページ</h1>
    <div class="sub" id="sub">読み込み中…</div>
  </header>
  <nav class="pnav" aria-label="ページ切り替え"><a href="./" aria-current="page">トップページ</a><a href="score/">点数入力</a><a class="rule" href="#" hidden>ルール</a><a class="tensu" href="#" hidden>点数早見表</a><a class="kuji" href="kuji/" hidden>対戦表</a></nav>

  <div id="setup" class="hint" hidden></div>

  <div id="main" hidden>
  <div class="card" id="info" hidden>
    <div class="info" id="whenrow"><span class="k">日時</span><span class="v" id="when"></span></div>
    <div class="info" id="whererow"><span class="k">場所</span><span class="v" id="where"></span></div>
  </div>
  <div id="remade" class="hint warn" hidden></div>
  <h2 id="mineh">自分の席</h2>
  <div class="card">
    <label for="me">自分の名前</label>
    <select id="me"></select>
    <div id="mine" style="margin-top:10px"></div>
  </div>

  <div id="schedbox" hidden>
  <h2>当日の流れ</h2>
  <div class="tw" id="schedtw"><table id="sched"></table></div>
  <p class="small" id="schednote" style="margin:6px 0 0"></p>
  <p class="hint" id="schedmemo" style="margin:8px 0 0" hidden></p>
  </div>

  <div id="uchibox" hidden>
  <h2>打ち上げ</h2>
  <div class="card party">
    <label for="ume">自分の名前</label>
    <select id="ume"></select>
    <p class="small" style="margin:4px 0 8px">上の「自分の名前」と同じです。どちらで選んでも、同じ名前になります。</p>
    <label class="opt"><input type="radio" name="uch" value="yes"><span>参加する</span></label>
    <label class="opt"><input type="radio" name="uch" value="no"><span>参加しない</span></label>
    <button type="button" class="send" id="usend">この内容で回答する</button>
    <button type="button" class="ghost" id="udel">回答を消す</button>
    <div class="st" id="ust" aria-live="polite"></div>
  </div>
  </div>

  <h2>半荘ごとの組み合わせ</h2>
  <p class="hint" id="kujibox" hidden></p>
  <div class="tools">
    <button class="ghost" type="button" id="reload">最新に更新</button>
    <span class="small" id="updated"></span>
  </div>
  <div id="rounds"></div>
  <ul class="small" style="padding-left:1.3em;margin:12px 0">
    <li id="seatnote">東が起家です。</li>
    <li>抜け番の半荘は0ポイントです。</li>
    <li id="finnote" hidden></li>
  </ul>
  </div>
  <nav class="pnav" aria-label="ページ切り替え"><a href="./" aria-current="page">トップページ</a><a href="score/">点数入力</a><a class="rule" href="#" hidden>ルール</a><a class="tensu" href="#" hidden>点数早見表</a><a class="kuji" href="kuji/" hidden>対戦表</a></nav>
</div>

<script>
// 普段の回のトップページ（参加者向け。日時と場所・自分の卓・当日の流れ・打ち上げ・組み合わせ）。会ごとの taikai.json（大会設定）と kumiawase.json（組み合わせ。kai/tools/kumiawase.py と kuji.py が書く）を読んで出す。
// 受け口からは名前（名簿）・入力済みの卓・打ち上げの回答を読む。送るのは打ち上げの回答だけ。当日に組み直して push したら、開き直すか「最新に更新」で出る
const $ = id => document.getElementById(id);
const WINDS = ['東', '南', '西', '北'];
const KAI_RE = /^[0-9A-Za-z-]{1,24}$/;
// 会（g）。URL の ?g=（英小文字・数字・-）で選ぶ。付けなければ halu（Halu杯）。設定と組み合わせは kai/g/<会>/ に置く
const G = new URLSearchParams(location.search).get('g') || 'halu';
const G_OK = /^[a-z0-9-]{1,20}$/.test(G);
// 設定の置き場（kai/ から見た場所）。試験の写しだけが window.KAI_CONF_DIR で差し替える
const CONF = window.KAI_CONF_DIR !== undefined ? window.KAI_CONF_DIR : 'g/' + G + '/';
// ページ間のリンクにも会を付ける（halu は付けない）。ルール・点数早見表は会のフォルダの中なので付けない
document.querySelectorAll('.pnav a:not(.rule):not(.tensu)').forEach(a => { if (G !== 'halu') a.setAttribute('href', a.getAttribute('href') + '?g=' + encodeURIComponent(G)); });
// 会の色とホーム画面の名前（taikai.json の color・short）。色はページの --accent とブラウザの帯の色に使う
function applyTheme(c) {
  if (/^#[0-9a-fA-F]{6}$/.test(c.color || '')) {
    document.documentElement.style.setProperty('--accent', c.color);
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', c.color);
  }
  let t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (!t) { t = document.createElement('meta'); t.name = 'apple-mobile-web-app-title'; document.head.appendChild(t); }
  t.content = c.short || c.group || c.title || '';
}
// ルール・点数早見表のページ（taikai.json の rule・tensu。会のフォルダの中の .html）がある会だけ、切り替えボタンに出す。くじは、くじで決める会（kuji）だけ
function pageLinks(c) {
  ['rule', 'tensu'].forEach(k => {
    const u = /^[a-z0-9-]{1,30}\.html$/.test(c[k] || '') ? CONF + c[k] : '';
    document.querySelectorAll('.pnav a.' + k).forEach(a => { a.hidden = !u; if (u) a.setAttribute('href', u); });
  });
  document.querySelectorAll('.pnav a.kuji').forEach(a => { a.hidden = !/^\d{4}-\d{2}-\d{2}$/.test(c.kuji || ''); });
}
let CFG = null, KUMI = null, ROSTER = {}, DATA = null, LAST_LOAD = 0;
const nm = p => (p && ROSTER[p]) || '';
const dn = p => nm(p) || p || '';
const dnf = p => p ? p + (nm(p) ? ' ' + nm(p) : '') : '';
const pnum = p => Number(String(p).slice(1));
// 覚えた名前（端末の中）。今回の名簿にない番号なら、選んでいないのと同じに扱う（覚えたものは消さない）
let SAVED = '', ME = '';
try { SAVED = localStorage.getItem('halukai:me:' + G) || ''; } catch (e) {}

function checkCfg(c) {
  const e = [];
  if (!c || typeof c !== 'object') return ['中身が読めません'];
  if (!KAI_RE.test(String(c.kai || ''))) e.push('kai');
  if (c.mode !== 3 && c.mode !== 4) e.push('mode');
  if (!Number.isInteger(c.players) || c.players < 3 || c.players > 99) e.push('players');
  if (!Number.isInteger(c.prelim) || c.prelim < 1 || c.prelim > 20) e.push('prelim');
  if (!c.final || !Number.isInteger(c.final.tables)) e.push('final');
  return e;
}
const rounds = () => (KUMI && KUMI.rounds) ? Object.keys(KUMI.rounds).filter(k => /^\d+$/.test(k)).sort((a, b) => a - b) : [];
function players() {
  const s = new Set(Array.from({ length: CFG.players }, (_, i) => 'P' + (i + 1)));
  rounds().forEach(k => { const r = KUMI.rounds[k]; (r.tables || []).forEach(t => (t.p || []).forEach(p => s.add(p))); (r.rest || []).forEach(p => s.add(p)); (r.out || []).forEach(p => s.add(p)); });
  return [...s].sort((a, b) => pnum(a) - pnum(b));
}
const doneOf = (k, no) => !!(DATA && DATA.rounds && DATA.rounds[k] && DATA.rounds[k][String(no)]);
// 場決めあり（taikai.json の bakime）。席は半荘ごとに牌を引いて決めるので、組み合わせ表の並びは席でない（風を出さない）
const bakime = () => !!(CFG && CFG.bakime === true);
// 当日の流れ（taikai.json の schedule＝[["10:45","集合・受付"], …]。幹部用の時間割と同じ）。開催日の当日は、いまの行に色をつける
const T_RE = /^([01]?\d|2[0-3]):[0-5]\d$/;
const mins = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const str = v => typeof v === 'string' ? v.trim() : '';
const schedRows = () => Array.isArray(CFG.schedule) ? CFG.schedule.filter(r => Array.isArray(r) && T_RE.test(String(r[0])) && typeof r[1] === 'string') : [];
function renderSched() {
  const s = schedRows(), memo = str(CFG.schedule_note);
  $('schedbox').hidden = !s.length;
  $('schedmemo').hidden = !(s.length && memo); $('schedmemo').textContent = memo;
  if (!s.length) { $('schednote').textContent = ''; return; }
  const isToday = CFG.date === today();
  let cur = -1;
  if (isToday) { const d = new Date(), now = d.getHours() * 60 + d.getMinutes(); s.forEach((r, i) => { if (mins(r[0]) <= now) cur = i; }); }
  const t = $('sched');
  t.innerHTML = '<thead><tr><th>時刻</th><th>内容</th></tr></thead>';
  const tb = document.createElement('tbody');
  s.forEach((r, i) => {
    const tr = document.createElement('tr'); if (i === cur) tr.className = 'now';
    [r[0], r[1] + (i === cur ? '（いま）' : '')].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  $('schednote').textContent = isToday ? '色のついた行が、いまの時間です。時刻は目安です。' : '時刻は目安です。';
}
// ページの一番上の日時と場所。日時は開催日（taikai.json の date）と、当日の流れの最初と「終了」の行の時刻。
// 場所は taikai.json の place・address。地図はグーグルマップで住所を探す（郵便番号は外す）
const WDAY = ['日', '月', '火', '水', '木', '金', '土'];
function dayText(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return '';
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日（' + WDAY[d.getDay()] + '）';
}
function renderInfo() {
  const day = dayText(CFG.date), place = str(CFG.place), s = schedRows();
  // 「10:45 集合 〜 18:30 終了（目安）」。内容は「・」の前だけ（集合・受付・写真撮影 → 集合）。
  // 終わりは「終了」で始まる行（その後の打ち上げは入れない）。なければ最後の行
  const at = r => r[0] + ' ' + r[1].split('・')[0];
  const end = s.find(r => r[1].startsWith('終了')) || s[s.length - 1];
  const when = $('when'); when.innerHTML = '';
  if (day) {
    when.appendChild(document.createTextNode(day));
    if (s.length > 1) { when.appendChild(document.createElement('br')); when.appendChild(document.createTextNode(at(s[0]) + ' 〜 ' + at(end))); }
  }
  $('whenrow').hidden = !day;
  $('whererow').hidden = !place;
  renderPlace(place, str(CFG.address));
  $('info').hidden = !day && !place;
}
function renderPlace(place, addr) {
  const box = $('where'); box.innerHTML = '';
  if (!place) return;
  const b = document.createElement('b'); b.textContent = place; box.appendChild(b);
  if (addr) { box.appendChild(document.createElement('br')); box.appendChild(document.createTextNode(addr)); }
  const a = document.createElement('a');
  a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((addr.replace(/^〒?\s*\d{3}-\d{4}\s*/, '') + ' ' + place).trim());
  a.target = '_blank'; a.rel = 'noopener'; a.textContent = '地図を開く';
  box.appendChild(document.createElement('br')); box.appendChild(a);
}

function render() {
  const c = CFG;
  document.title = c.title + ' トップページ';
  $('ttl').textContent = '🀄 ' + c.title + ' トップページ';
  $('sub').textContent = [c.mode + '麻', '予選' + c.prelim + '半荘', c.final.tables > 0 ? '決勝' + (c.final.tables > 1 ? c.final.tables + '卓' : '') + (c.final.hanchan > 1 ? c.final.hanchan + '半荘' : '') : ''].filter(Boolean).join('・');
  const rs = rounds();
  // 組み直しの知らせ（前日の表を見ていた人が取り違えないように）。くじの会の抽せんの後は、1半荘目からの組み直しにも remade が付く
  const rm = $('remade');
  rm.hidden = !(KUMI && (KUMI.from > 1 || KUMI.remade === true));
  if (!rm.hidden) rm.textContent = (KUMI.from > 1 ? KUMI.from + '半荘目から' : '組み合わせを') + '組み直しました（' + KUMI.made + '）。前の表を見ていた人は、自分の' + (bakime() ? '卓' : '席') + 'を確かめ直してください。';
  $('mineh').textContent = bakime() ? '自分の卓' : '自分の席';
  const junni = c.final.tables > 0 && c.final.junni === 1;
  $('seatnote').textContent = bakime() ? '席は、予選も決勝も' + (junni ? '順位決定戦も、' : '') + '半荘ごとに牌を引いて決めます。起家はサイコロで決めます。表の並び順は、席ではありません。' : '東が起家です。';
  // 自分の名前。上の「自分の卓」と打ち上げの欄の2か所に同じ選び方を出す（どちらで選んでも同じ ME）
  const list = players();
  ['me', 'ume'].forEach(id => {
    const sel = $(id);
    sel.innerHTML = '';
    sel.appendChild(new Option('（選ぶ）', ''));
    list.forEach(p => sel.appendChild(new Option(dnf(p), p)));
  });
  ME = list.includes(SAVED) ? SAVED : '';
  $('me').value = ME; $('ume').value = ME;
  renderInfo();
  renderMine();
  renderSched();
  renderUchi();
  renderKuji();
  // 半荘ごと
  const box = $('rounds'); box.innerHTML = '';
  if (!rs.length) { box.innerHTML = '<p><b>組み合わせはまだ決まっていません。' + (kujiDay() ? dayText(kujiDay()) + 'の夜に、くじで決まります。' : '前日に出ます。') + '</b></p>'; }
  rs.forEach(k => {
    const r = KUMI.rounds[k], tabs = (r.tables || []).slice().sort((a, b) => a.no - b.no);
    const h = document.createElement('h3');
    const done = tabs.filter(t => doneOf(k, t.no)).length;
    h.textContent = '予選 ' + k + '半荘目';
    if (DATA) { const s = document.createElement('span'); s.className = 'small'; s.textContent = '　点数 ' + done + '/' + tabs.length + '卓'; if (done === tabs.length && tabs.length) s.className = 'small done'; h.appendChild(s); }
    box.appendChild(h);
    const tw = document.createElement('div'); tw.className = 'tw';
    const tbl = document.createElement('table');
    tbl.innerHTML = '<thead><tr><th>卓</th>' + (bakime() ? '<th colspan="' + c.mode + '">この卓の' + c.mode + '人</th>' : WINDS.slice(0, c.mode).map(w => '<th>' + w + '</th>').join('')) + '</tr></thead>';
    const tb = document.createElement('tbody');
    tabs.forEach(t => {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = t.no + '卓' + (doneOf(k, t.no) ? ' ✓' : ''); tr.appendChild(a);
      (t.p || []).forEach(p => { const td = document.createElement('td'); td.textContent = dn(p); if (p === ME) td.className = 'me'; tr.appendChild(td); });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); tw.appendChild(tbl); box.appendChild(tw);
    const extra = [];
    if ((r.rest || []).length) extra.push('抜け番: ' + r.rest.map(p => (p === ME ? '【' + dn(p) + '】' : dn(p))).join('・'));
    if ((r.out || []).length) extra.push('お休み: ' + r.out.map(dn).join('・'));
    if (extra.length) { const p = document.createElement('p'); p.className = 'small'; p.style.margin = '4px 0'; p.textContent = extra.join('　'); box.appendChild(p); }
  });
  const fn = $('finnote');
  fn.hidden = !(c.final.tables > 0);
  if (!fn.hidden) fn.textContent = '決勝は、予選の上位' + c.final.tables * c.mode + '人です（途中で抜けた人は飛ばします）。'
    + (junni ? 'ほかの人は、決勝1半荘目の時間に順位決定戦を1半荘打ちます。決勝2半荘目は、決勝に出ない人も観戦します。決勝と順位決定戦の卓は、予選が終わると点数入力ページに出ます。' : '決勝の卓は予選が終わると点数入力ページに出ます。')
    + (bakime() ? '' : '席は自動卓のサイコロで決めます。');
}
function renderMine() {
  const box = $('mine'); box.innerHTML = '';
  const rs = rounds();
  if (!ME) { box.innerHTML = '<p class="small">名前を選ぶと、半荘ごとの卓' + (bakime() ? '' : 'と席') + 'が出ます（この端末に覚えます）。</p>'; return; }
  if (!rs.length) { box.innerHTML = '<p class="small">組み合わせはまだ決まっていません。</p>'; return; }
  const tw = document.createElement('div'); tw.className = 'tw';
  const tbl = document.createElement('table'); tbl.id = 'mine';
  if (bakime()) tbl.className = 'noseat';
  tbl.innerHTML = '<thead><tr><th>半荘</th><th>卓</th>' + (bakime() ? '' : '<th>席</th>') + '<th>同じ卓の人</th></tr></thead>';
  const tb = document.createElement('tbody');
  rs.forEach(k => {
    const r = KUMI.rounds[k], tr = document.createElement('tr');
    const t = (r.tables || []).find(x => (x.p || []).includes(ME));
    const cells = t ? [k + '半荘目', t.no + '卓', WINDS[t.p.indexOf(ME)], t.p.filter(p => p !== ME).map(dn).join('・')]
      : (r.rest || []).includes(ME) ? [k + '半荘目', '—', '—', '抜け番（0ポイント）'] : [k + '半荘目', '—', '—', 'お休み'];
    if (bakime()) cells.splice(2, 1);
    cells.forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); tw.appendChild(tbl); box.appendChild(tw);
}
// 名前を選んだら（上の欄でも打ち上げの欄でも）、この端末に覚えて出し直す。
// 打ち上げの欄で選んだときは、上の表が伸び縮みしても、その欄が画面の同じ所に残るようにする
function pickMe(v, keep) {
  SAVED = v;
  try { localStorage.setItem('halukai:me:' + G, SAVED); } catch (e) {}
  const y = keep ? keep.getBoundingClientRect().top : 0;
  render();
  if (keep) window.scrollBy(0, keep.getBoundingClientRect().top - y);
}
$('me').addEventListener('change', () => pickMe($('me').value));
$('ume').addEventListener('change', () => pickMe($('ume').value, $('ume')));

// ---- 打ち上げ（taikai.json の uchiage が true の会。第20回の参加者ページ7章を、P番号で答える形にしたもの） ----
// 答えるのは「自分の名前」で選んだ人（この欄の名前の欄は、上の「自分の名前」と同じ ME）。受け口に P番号ごとに置く。全員の出欠は、幹部用ページにだけ出す（主催）
const UCH_LABEL = { yes: '参加する', no: '参加しない' };
// 受け口の回答（{P3: {choice, ts}}）と、読めたか（ok・old＝受け口が古い・net＝通信・none＝受け口なし）
let UCHI = {}, UCHI_ST = 'none';
const uts = ts => ts ? String(ts).slice(5, 16).replace('-', '/') : '';
function sayU(t, cls) { const m = $('ust'); m.textContent = t; m.className = 'st' + (cls ? ' ' + cls : ''); }
function renderUchi() {
  $('uchibox').hidden = !(CFG.uchiage === true);
  if (CFG.uchiage !== true) return;
  const ok = UCHI_ST === 'ok', mine = ME && UCHI[ME] && UCH_LABEL[UCHI[ME].choice] ? UCHI[ME] : null;
  document.querySelectorAll('input[name=uch]').forEach(x => { x.checked = !!(mine && mine.choice === x.value); x.disabled = !ok || !ME; });
  $('usend').disabled = !ok || !ME; $('udel').disabled = !ok || !mine;
  if (!ok) sayU(UCHI_ST === 'net' ? '回答を読めませんでした（通信）。少し待ってから開き直してください。' : '打ち上げの回答は、まだ受け付けていません（準備中）。', UCHI_ST === 'net' ? 'ng' : '');
  else if (mine) sayU('回答済み: ' + UCH_LABEL[mine.choice] + '（' + uts(mine.ts) + '）', 'ok');
  else sayU(ME ? 'まだ回答がありません。' : '名前を選ぶと、答えられます。');
}
async function sendUchi(choice) {
  if (!ME) { sayU('名前を選んでください', 'ng'); return; }
  if (choice === undefined) { const r = document.querySelector('input[name=uch]:checked'); if (!r) { sayU('「参加する」か「参加しない」を選んでください', 'ng'); return; } choice = r.value; }
  const who = ME;
  sayU('送信中…');
  try {
    const r = await fetch(String(CFG.api || '').trim(), { method: 'POST', body: JSON.stringify({ action: 'uchiage', kai: CFG.kai, player: who, choice }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'ng');
    UCHI = (j.data && j.data.uchiage) || {};
    renderUchi();
    if (!choice) sayU('回答を消しました');
  } catch (e) { sayU(e.message === 'action' ? '受け口が古いため、まだ答えられません（幹部に知らせてください）' : '送れませんでした。電波のよい所でもう一度お試しください', 'ng'); }
}
$('usend').addEventListener('click', () => sendUchi());
$('udel').addEventListener('click', () => { if (confirm('打ち上げの回答を消しますか？')) sendUchi(''); });

// ---- くじ（taikai.json の kuji＝抽せんの日。その日のナンバーズ4の当せん番号で、誰がどの枠に入るかを決める。kai/tools/kuji.py） ----
const kujiDay = () => /^\d{4}-\d{2}-\d{2}$/.test(CFG.kuji || '') ? CFG.kuji : '';
function renderKuji() {
  const d = kujiDay(), box = $('kujibox');
  box.hidden = !d; box.innerHTML = '';
  if (!d) return;
  const n4 = KUMI && KUMI.kuji && /^\d{4}$/.test(KUMI.kuji.n4 || '') ? KUMI.kuji.n4 : '';
  box.appendChild(document.createTextNode(n4
    ? '組み合わせは、' + dayText(d) + 'のナンバーズ4の当せん番号「' + n4 + '」で、くじで決めました。'
    : '卓と抜け番の並び（型）は決めてあります。誰がどの枠に入るかは、' + dayText(d) + 'のナンバーズ4の当せん番号で、くじで決めます。'));
  const a = document.createElement('a'); a.href = 'kuji/' + (G !== 'halu' ? '?g=' + encodeURIComponent(G) : ''); a.textContent = '対戦表のページ（くじの決まり・型・検算）';
  box.appendChild(document.createElement('br')); box.appendChild(a);
}

const bust = u => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();
async function getJson(u) { const r = await fetch(bust(u), { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
function setup(msg) { $('setup').textContent = msg; $('setup').hidden = !msg; }
async function load() {
  LAST_LOAD = Date.now();
  if (!G_OK) { setup('会の名前（URL の ?g=）の形が違います。'); return; }
  let c;
  try { c = await getJson(CONF + 'taikai.json'); }
  catch (e) { if (!CFG) setup('この会（' + G + '）の大会設定（taikai.json）を読めませんでした。URL の ?g= を確かめて、少し待ってから開き直してください。'); return; }
  const errs = checkCfg(c);
  if (errs.length) { setup('大会設定（taikai.json）の書き方が違います: ' + errs.join('・')); $('main').hidden = true; return; }
  const notes = [];
  let k = null;
  try { k = await getJson(CONF + 'kumiawase.json'); } catch (e) { k = null; }
  if (k && (k.kai !== c.kai || !k.rounds || typeof k.rounds !== 'object')) { if (k.kai !== c.kai && Object.keys(k.rounds || {}).length) notes.push('組み合わせ表（kumiawase.json）が前の回のままなので出していません。'); k = null; }
  CFG = c; KUMI = k;
  applyTheme(c);
  pageLinks(c);
  const api = String(c.api || '').trim();
  if (!api) UCHI_ST = 'none';
  if (api) {
    try {
      const j = await getJson(api + '?kai=' + encodeURIComponent(c.kai));
      if (j.ok && j.data && j.data.kai === c.kai) {
        ROSTER = j.data.roster || {}; DATA = j.data; $('updated').textContent = j.data.updated ? '点数の最終更新 ' + j.data.updated : '';
        // 打ち上げの回答（古い受け口は uchiage を返さない）
        const u = j.data.uchiage;
        UCHI_ST = u && typeof u === 'object' && !Array.isArray(u) ? 'ok' : 'old'; UCHI = UCHI_ST === 'ok' ? u : {};
      }
    }
    catch (e) { notes.push('名前を読めませんでした（通信）。番号で出しています。'); if (UCHI_ST !== 'ok') UCHI_ST = 'net'; }
  }
  setup(notes.join(' '));
  $('main').hidden = false;
  render();
}
$('reload').addEventListener('click', load);
load();
// 当日は、いまの行の色を1分ごとに動かす
setInterval(() => { if (CFG) renderSched(); }, 60000);
// ホーム画面のアプリ用の読み込みの手伝い（kai/sw.js）。試験の写しでは使わない
if ('serviceWorker' in navigator && window.KAI_CONF_DIR === undefined) navigator.serviceWorker.register('sw.js').catch(() => {});
// 裏から戻ったとき、2分以上たっていれば読み直す（当日の組み直しに気づけるように）
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - LAST_LOAD >= 120000) load(); });
</script>
